<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImageMerge Pro</title>
  <link rel="icon" type="image/png" href="favicon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
  <canvas id="bg-canvas"></canvas>

  <div class="container">
    <nav class="tabs glass-panel"
      style="padding: 10px; display: flex; justify-content: center; gap: 20px; margin-bottom: 20px;">
      <button class="tab-btn active" data-tab="merger-section">Pixel Merger</button>
      <button class="tab-btn" data-tab="converter-section">Image Converter</button>
    </nav>

    <!-- MERGER SECTION -->
    <div id="merger-section" class="tab-content active">
      <main class="glass-panel">
        <div class="controls-grid">
          <div class="control-group">
            <label>Source Image</label>
            <div class="file-upload">
              <div class="file-btn" id="btn-file1">Select Image 1</div>
              <input type="file" id="file1" accept="image/*">
            </div>
          </div>
          <div class="control-group">
            <label>Target Palette Image</label>
            <div class="file-upload">
              <div class="file-btn" id="btn-file2">Select Image 2</div>
              <input type="file" id="file2" accept="image/*">
            </div>
          </div>
        </div>

        <div class="controls-grid">
          <div class="control-group">
            <label for="downscale">Downscale Factor (1-50)</label>
            <input type="number" id="downscale" value="4" min="1" max="50">
          </div>
          <div class="control-group">
            <label for="animRes">Animation Resolution</label>
            <input type="number" id="animRes" value="32" min="8" max="128" step="8">
          </div>
          <div class="control-group" style="flex-direction: row; align-items: center; gap: 10px; margin-top: 25px;">
            <input type="checkbox" id="showAnim" style="width: 20px; height: 20px;">
            <label for="showAnim" style="margin: 0; cursor: pointer;">Enable Animation</label>
          </div>
        </div>

        <button id="run" class="btn-primary">Start Processing</button>
        <p id="progress">Status: Ready</p>
      </main>

      <section class="glass-panel">
        <div class="canvas-grid">
          <div class="canvas-wrapper">
            <canvas id="canvas1"></canvas>
          </div>
          <div class="canvas-wrapper">
            <canvas id="canvas2"></canvas>
          </div>
        </div>

        <div class="output-section">
          <div class="canvas-wrapper" style="width: 100%; max-width: 800px;">
            <canvas id="canvasOut"></canvas>
          </div>
          <button id="download" class="btn-secondary" disabled>Download Result</button>
        </div>
      </section>
    </div>

    <!-- CONVERTER SECTION -->
    <div id="converter-section" class="tab-content" style="display: none;">
      <main class="glass-panel">
        <div class="controls-grid">
          <div class="control-group">
            <label>Image to Convert</label>
            <div class="file-upload">
              <div class="file-btn" id="btn-conv-file">Select Image</div>
              <input type="file" id="conv-file" accept="image/*">
            </div>
          </div>
          <div class="control-group">
            <label>Output Format</label>
            <select id="conv-format"
              style="padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); color: white; border-radius: 12px;">
              <option value="image/png">PNG</option>
              <option value="image/jpeg">JPEG</option>
              <option value="image/webp">WEBP</option>
            </select>
          </div>
        </div>

        <div class="controls-grid">
          <div class="control-group">
            <label>Resize Width (px) - Leave empty for original</label>
            <input type="number" id="conv-width" placeholder="Original">
          </div>
          <div class="control-group">
            <label>Resize Height (px) - Leave empty for original</label>
            <input type="number" id="conv-height" placeholder="Original">
          </div>
          <div class="control-group">
            <label>Quality (0.1 - 1.0) for JPEG/WEBP</label>
            <input type="number" id="conv-quality" value="0.9" step="0.1" min="0.1" max="1.0">
          </div>
        </div>

        <button id="btn-convert" class="btn-primary">Convert & Preview</button>
      </main>

      <section class="glass-panel" id="conv-result-panel" style="display: none;">
        <div class="output-section">
          <div class="canvas-wrapper" style="width: 100%; max-width: 800px;">
            <img id="conv-preview" style="max-width: 100%; max-height: 100%; object-fit: contain;">
          </div>
          <p id="conv-info" style="color: rgba(255,255,255,0.7);"></p>
          <button id="btn-conv-download" class="btn-secondary">Download Converted Image</button>
        </div>
      </section>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="audio.js"></script>
  <script src="background.js"></script>
  <script src="converter.js"></script>
  <script src="script.js"></script>
</body>

</html>
